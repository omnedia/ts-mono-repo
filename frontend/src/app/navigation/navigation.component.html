<div class="navigation-wrapper">
  <div class="logo">
    <p>MY APP</p>
  </div>

  <div class="actions">
    <p-button
      [icon]="appStore.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
      [rounded]="true"
      (click)="appStore.toggleTheme()"
    />
    <p-button (click)="logout()">Logout</p-button>
  </div>
</div>
