<div class="navigation-wrapper">
  <div class="logo">
    <p>MY APP</p>
  </div>

  <div class="actions">
    <button class="icon-button" (click)="appStore.toggleTheme()">
      <i
        class="pi"
        [class.pi-sun]="appStore.theme() === 'dark'"
        [class.pi-moon]="appStore.theme() === 'light'"
      ></i>
    </button>
    <button class="button" (click)="logout()">Logout</button>
  </div>
</div>
